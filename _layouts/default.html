<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | Nova Flow</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="canonical" href="{{ page.url | prepend: site.url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --vert: #2C3B2D; --vert-dark: #1e2a1f; --or: #C9A84C; --creme: #F5F0E8; --texte: #4a5a4b; }
    body { font-family: 'Montserrat', sans-serif; background: var(--creme); color: var(--vert); }

    nav { background: var(--vert); display: flex; justify-content: space-between; align-items: center; padding: 1rem 3rem; position: sticky; top: 0; z-index: 100; }
    .nav-logo { color: var(--creme); font-size: 14px; letter-spacing: 3px; font-weight: 600; text-decoration: none; }
    .nav-logo span { color: var(--or); font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 18px; font-weight: 400; }
    .nav-links { display: flex; gap: 2rem; list-style: none; }
    .nav-links a { color: rgba(245,240,232,0.75); text-decoration: none; font-size: 10px; letter-spacing: 2px; font-weight: 500; text-transform: uppercase; transition: color 0.2s; }
    .nav-links a:hover { color: var(--or); }

    footer { background: var(--vert-dark); padding: 2.5rem 3rem; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(201,168,76,0.15); }
    .footer-logo { font-size: 14px; letter-spacing: 3px; color: var(--creme); font-weight: 600; }
    .footer-logo span { color: var(--or); font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 18px; }
    .footer-copy { font-size: 11px; color: rgba(245,240,232,0.4); }
    .footer-links { display: flex; gap: 1.5rem; }
    .footer-links a { color: rgba(245,240,232,0.5); text-decoration: none; font-size: 11px; }
    .footer-links a:hover { color: var(--or); }

    @media(max-width:768px) {
      nav { padding: 1rem 1.5rem; }
      .nav-links { display: none; }
      footer { flex-direction: column; gap: 1rem; text-align: center; }
    }
  </style>
</head>
<body>

<nav>
  <a href="/index.html" class="nav-logo">NOVA <span>Flow</span></a>
  <ul class="nav-links">
    <li><a href="/index.html">Accueil</a></li>
    <li><a href="/index.html#prestations">Prestations</a></li>
    <li><a href="/massage-sportif.html">Massage sportif</a></li>
    <li><a href="/drainage-lymphatique.html">Drainage Vodder</a></li>
    <li><a href="/blog.html">Blog</a></li>
    <li><a href="/faq.html">FAQ</a></li>
    <li><a href="/index.html#reservation">Réserver</a></li>
  </ul>
</nav>

{{ content }}

<footer>
  <div class="footer-logo">NOVA <span>Flow</span></div>
  <div class="footer-copy">Nova Flow Massothérapie · Saint-Sulpice-la-Pointe (81370)</div>
  <div class="footer-links">
    <a href="/index.html">Accueil</a>
    <a href="/blog.html">Blog</a>
    <a href="/faq.html">FAQ</a>
  </div>
</footer>

</body>
</html>
