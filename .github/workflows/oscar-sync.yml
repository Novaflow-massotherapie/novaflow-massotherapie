name: Sync articles Oscar

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Récupérer les articles Oscar
        env:
          OSCAR_API_KEY: ${{ secrets.OSCAR_API_KEY }}
        run: |
          cat > /tmp/oscar-sync.js << 'SCRIPT'
          const https = require('https');
          const fs = require('fs');
          const path = require('path');

          const apiKey = process.env.OSCAR_API_KEY;
          const postsDir = '_posts';

          if (!fs.existsSync(postsDir)) fs.mkdirSync(postsDir);

          function fetchArticles(cursor) {
            return new Promise((resolve, reject) => {
              const url = cursor
                ? 'https://beta-api.oscar-seo.ai/v1/articles?pageSize=10&cursor=' + cursor
                : 'https://beta-api.oscar-seo.ai/v1/articles?pageSize=10';
              const options = { headers: { 'Authorization': 'Bearer ' + apiKey } };
              https.get(url, options, (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  try { resolve(JSON.parse(data)); }
                  catch(e) { reject(new Error('JSON parse error: ' + data)); }
                });
              }).on('error', reject);
            });
          }

          async function main() {
            let cursor = null;
            let totalPublished = 0;
            do {
              const response = await fetchArticles(cursor);
              const articles = response.data || [];
              for (const article of articles) {
                if (article.status !== 'ready') continue;
                const d = new Date(article.createdAt);
                const dateStr = d.toISOString().split('T')[0];
                const filename = dateStr + '-' + article.slug + '.md';
                const filepath = path.join(postsDir, filename);
                if (fs.existsSync(filepath)) continue;
                const title = (article.title || '').replace(/"/g, '\\"');
                const desc = (article.metaDescription || '').replace(/"/g, '\\"');
                // Nettoyer le HTML Oscar : enlever <style> et wrapper <div class="oscar-article">
                let html = article.html || '';
                html = html.replace(/<style[^>]*>[\s\S]*?<\/style>/gi, '');
                html = html.replace(/<div[^>]*class="oscar-article"[^>]*>/gi, '');
                html = html.replace(/<\/div>\s*$/gi, '');
                html = html.trim();

                const fileContent =
                  '---\n' +
                  'layout: post\n' +
                  'title: "' + title + '"\n' +
                  'description: "' + desc + '"\n' +
                  'date: ' + dateStr + '\n' +
                  'category: "Bien-être & Massage"\n' +
                  'read_time: "5 min"\n' +
                  '---\n\n' +
                  html;
                fs.writeFileSync(filepath, fileContent);
                console.log('Publié : ' + filename);
                totalPublished++;
              }
              cursor = (response.hasMore && response.nextCursor) ? response.nextCursor : null;
            } while (cursor);
            console.log('Total : ' + totalPublished + ' article(s)');
          }

          main().catch(err => { console.error(err); process.exit(1); });
          SCRIPT
          node /tmp/oscar-sync.js

      - name: Commit automatique
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Articles Oscar du ${{ github.run_started_at }}"
          file_pattern: '_posts/*.md'
